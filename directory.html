<script>
(function () {
  // 示例数据：条目名称、分类、一句话介绍、电话（占位）、是否置顶广告。
  // 上线前由人工核验并替换为真实商家；付费置顶条目 feature=true。
  var DATA = [
    { name: "示例·花桥面馆", cat: "餐饮美食", desc: "示例条目：本地面馆，主打苏式汤面（待商家核实入驻）。", phone: "0512-0000 0001", feature: true },
    { name: "示例·江南家常菜", cat: "餐饮美食", desc: "示例条目：家常菜馆，适合家庭聚餐（待商家核实入驻）。", phone: "0512-0000 0002", feature: false },
    { name: "示例·花桥生鲜超市", cat: "生活服务", desc: "示例条目：社区生鲜超市，蔬果肉禽每日上新（待商家核实入驻）。", phone: "0512-0000 0003", feature: true },
    { name: "示例·便民维修站", cat: "生活服务", desc: "示例条目：水电维修、家电清洗上门服务（待商家核实入驻）。", phone: "0512-0000 0004", feature: false },
    { name: "示例·启航教育", cat: "教育培训", desc: "示例条目：中小学课后辅导与兴趣班（待商家核实入驻）。", phone: "0512-0000 0005", feature: false },
    { name: "示例·花桥口腔诊所", cat: "医疗健康", desc: "示例条目：口腔检查、洁牙与基础治疗（待商家核实入驻）。", phone: "0512-0000 0006", feature: false },
    { name: "示例·花桥影城", cat: "休闲娱乐", desc: "示例条目：多厅影院，含儿童厅（待商家核实入驻）。", phone: "0512-0000 0007", feature: false }
  ];

  var listEl = document.getElementById("bizList");
  var filterEls = [].slice.call(document.querySelectorAll("#filters button"));
  var current = "全部";

  function render() {
    var html = "";
    DATA.forEach(function (b) {
      if (current !== "全部" && b.cat !== current) return;
      html += '<div class="biz' + (b.feature ? " featured" : "") + '">' +
        '<div style="flex:1">' +
        '<span class="tag">' + (b.feature ? "广告·置顶" : b.cat) + '</span>' +
        '<h4>' + b.name + '</h4>' +
        '<p>' + b.desc + '</p>' +
        '<div class="phone">' + b.phone + '</div>' +
        '</div></div>';
    });
    listEl.innerHTML = html || '<p class="small-note">该分类暂无条目，等待商家入驻。</p>';
  }

  filterEls.forEach(function (btn) {
    btn.addEventListener("click", function () {
      current = btn.getAttribute("data-cat");
      filterEls.forEach(function (b) { b.classList.remove("on"); });
      btn.classList.add("on");
      render();
    });
  });

  render();
})();
</script>
